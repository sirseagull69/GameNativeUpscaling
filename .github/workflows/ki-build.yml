name: KI Upscaler Testbuild

# Builds the "ki" test variant (app.gamenative.ki) and publishes the APK as the
# "ki-latest" pre-release, so it can be downloaded straight onto the handheld.

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ki-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Shader compiler for the native Vulkan renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools && glslangValidator --version | head -1

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dummy credentials
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Build bundle (modern, ki)
        run: |
          set -o pipefail
          if ! ./gradlew -Pkotlin.daemon.jvmargs=-Xmx3g :app:bundleModernKi 2>&1 | tee gradle.log; then
            # Surface the Gradle error as annotations (readable via the API without raw logs).
            python3 - <<'PY'
          import re
          log = open("gradle.log", encoding="utf-8", errors="replace").read()
          parts = []
          m = re.search(r"\* What went wrong:(.*?)(\* Try:|\Z)", log, re.S)
          if m:
              parts.append("WHAT WENT WRONG:" + m.group(1).strip()[:3000])
          errs = [l for l in log.splitlines() if re.match(r"^(e: |.*error:|ERROR:)", l)]
          if errs:
              parts.append("ERRORS:\n" + "\n".join(errs[:40])[:3000])
          if not parts:
              parts.append("\n".join(log.splitlines()[-60:])[-3000:])
          for p in parts:
              print("::error title=gradle::" + p.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
            exit 1
          fi

      - name: Stop Gradle daemon
        run: ./gradlew --stop

      - name: Check KI code is in the native renderer
        run: |
          SO=$(find app/build -path '*modernKi*' -name libvulkan_renderer.so | head -1)
          echo "$SO"
          strings -a "$SO" | grep -q 'KI: initialised' || { echo "::error title=gradle::libvulkan_renderer.so has no KI code ($SO)"; exit 1; }

      - name: Universal APK
        run: |
          AAB=$(ls app/build/outputs/bundle/modernKi/*.aab | head -1)
          java -jar tools/bundletool-all-1.17.2.jar build-apks \
            --bundle="$AAB" --output=ki.apks --mode=universal \
            --ks=ki/ki-test.keystore --ks-key-alias=ki \
            --ks-pass=pass:gamenativeki --key-pass=pass:gamenativeki
          unzip -p ki.apks universal.apk > GameNative-KI.apk
          ls -la GameNative-KI.apk

      - name: Publish as ki-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          gh release delete ki-latest --yes --cleanup-tag || true
          gh release create ki-latest GameNative-KI.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "GameNative KI (Testbuild $SHORT)" \
            --notes "Automatischer Testbuild vom KI-Upscaler. Ersetzt GameNative (vorher deinstallieren, andere Signatur)."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-KI
          path: GameNative-KI.apk
